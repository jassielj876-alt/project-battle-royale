name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Preparar proyecto
        run: |
          if [ -f project.zip ]; then
            mkdir -p game
            unzip -o project.zip -d game
            echo "PROJECT_PATH=game" >> "$GITHUB_ENV"
          else
            echo "PROJECT_PATH=." >> "$GITHUB_ENV"
          fi

      - name: Preparar Godot (plantillas, ajustes de Android y keystore de debug)
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          if [ -d /root/.config/godot ] && [ "$HOME" != "/root" ]; then
            cp -r /root/.config/godot ~/.config/ || true
          fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ] && [ "$HOME" != "/root" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          fi
          if [ -z "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -keystore "$HOME/debug.keystore" -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Importar recursos
        run: |
          cd "$PROJECT_PATH"
          godot --headless --verbose --import || true

      - name: Exportar APK (debug, instalable)
        run: |
          mkdir -v -p "$GITHUB_WORKSPACE/build/android"
          cd "$PROJECT_PATH"
          godot --headless --verbose --export-debug "Android" "$GITHUB_WORKSPACE/build/android/ProjectBattleRoyale.apk"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectBattleRoyale-apk
          path: build/android/ProjectBattleRoyale.apk
